[ktfmt]
version = "0.64"
style = "kotlinlang"

[gradle-dependencies-sorter]
version = "0.21.0"
insert-blank-lines = false

[paths]
# testData contains deliberately malformed Kotlin used as compiler test
# fixtures; it must not be formatted or given license headers.
exclude = { extend = ["**/testData/**"] }

[license-header]
file = "config/license-header.txt"

[whitespace]
strip-trailing = true
final-newline = true

[hook]
mode = "format"
